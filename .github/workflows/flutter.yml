name: Flutter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/ledger_test.dart test/recurring_calendar_test.dart
      - run: flutter build web --release
      - run: flutter build apk --debug
